<!doctype html><html lang="ko"><meta charset="utf-8"><title>신규 공격 12프레임</title><style>body{margin:32px;background:#171d28;color:#eee;font:16px sans-serif}h1{font-size:25px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{background:#283344;padding:16px;border-radius:12px}img{width:100%;background:repeating-conic-gradient(#394455 0% 25%,#323c4c 0% 50%) 0/24px 24px}button,input{margin:12px}small{display:block;margin-bottom:12px}</style><h1>신규 공격 · 12프레임 미리보기</h1><p>청팀·홍팀 차징 / 강공격 / 점프공격 / 특수공격 및 효과</p><button id="pause">일시정지</button><label>초당 프레임 <input id="fps" type="range" min="6" max="30" value="18"><span id="speed">18</span></label><main></main><script>
const sets=["effects/heavy_impact","effects/projectile_blue","effects/projectile_red","team blue/13_heavy_charge","team blue/14_heavy_attack","team blue/15_jump_attack","team blue/16_special_cast","team red/13_heavy_charge","team red/14_heavy_attack","team red/15_jump_attack","team red/16_special_cast"];let n=0,playing=true;const main=document.querySelector('main');sets.forEach(s=>{const a=document.createElement('article');a.innerHTML='<small>'+s+'</small><img alt="'+s+'"><p class="counter"></p>';main.append(a)});function show(){document.querySelectorAll('article').forEach((a,i)=>{a.querySelector('img').src=sets[i]+'/frame_'+String(n%12+1).padStart(2,'0')+'.png';a.querySelector('.counter').textContent=(n%12+1)+' / 12'})}function tick(){if(playing){show();n++}setTimeout(tick,1000/+fps.value)}pause.onclick=()=>{playing=!playing;pause.textContent=playing?'일시정지':'재생'};fps.oninput=()=>speed.textContent=fps.value;tick();</script></html>
