<!doctype html><meta charset="utf-8"><title>12프레임 모션 미리보기</title><style>body{background:#18202b;color:#eee;font:16px system-ui;margin:24px}header{position:sticky;top:0;background:#18202bf0;padding:15px;z-index:1}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}article{background:#303c4c;border-radius:12px;padding:16px}img{width:100%;aspect-ratio:1;object-fit:contain}h2{font-size:16px}button,input{margin:8px}</style><header><h1>12프레임 모션</h1><button id="toggle">일시정지</button><label>재생 속도 <input id="fps" type="range" min="4" max="36" value="18"><span id="speed">18</span> fps</label><p>개별 PNG 512×512 · 프레임 01~12 · 패배/충격파는 확인을 위해 반복됩니다.</p></header><main></main><script>const items=[{"label":"blue / 01_idle","path":"team blue/01_idle"},{"label":"blue / 02_move_right","path":"team blue/02_move_right"},{"label":"blue / 03_move_left","path":"team blue/03_move_left"},{"label":"blue / 04_attack_middle","path":"team blue/04_attack_middle"},{"label":"blue / 05_attack_high","path":"team blue/05_attack_high"},{"label":"blue / 06_attack_low","path":"team blue/06_attack_low"},{"label":"blue / 07_jump","path":"team blue/07_jump"},{"label":"blue / 08_duck","path":"team blue/08_duck"},{"label":"blue / 09_ground_hit","path":"team blue/09_ground_hit"},{"label":"blue / 10_air_hit","path":"team blue/10_air_hit"},{"label":"blue / 11_defeat","path":"team blue/11_defeat"},{"label":"blue / 12_backwalk","path":"team blue/12_backwalk"},{"label":"red / 01_idle","path":"team red/01_idle"},{"label":"red / 02_move_right","path":"team red/02_move_right"},{"label":"red / 03_move_left","path":"team red/03_move_left"},{"label":"red / 04_attack_middle","path":"team red/04_attack_middle"},{"label":"red / 05_attack_high","path":"team red/05_attack_high"},{"label":"red / 06_attack_low","path":"team red/06_attack_low"},{"label":"red / 07_jump","path":"team red/07_jump"},{"label":"red / 08_duck","path":"team red/08_duck"},{"label":"red / 09_ground_hit","path":"team red/09_ground_hit"},{"label":"red / 10_air_hit","path":"team red/10_air_hit"},{"label":"red / 11_defeat","path":"team red/11_defeat"},{"label":"red / 12_backwalk","path":"team red/12_backwalk"},{"label":"충격파","path":"effects/shockwave"}];let playing=true,start=performance.now(),last=0;const nodes=items.map(item=>{const a=document.createElement("article"),h=document.createElement("h2"),im=document.createElement("img"),info=document.createElement("p");h.textContent=item.label;a.append(h,im,info);document.querySelector("main").append(a);const frames=Array.from({length:12},(_,i)=>{const img=new Image();img.src=item.path+"/frame_"+String(i+1).padStart(2,"0")+".png";return img});return{im,info,frames}});document.querySelector("#toggle").onclick=()=>{playing=!playing;document.querySelector("#toggle").textContent=playing?"일시정지":"재생"};document.querySelector("#fps").oninput=e=>document.querySelector("#speed").textContent=e.target.value;function tick(now){if(playing&&now-last>1000/+document.querySelector("#fps").value){last=now;const n=(window.frameIndex||0)%12;nodes.forEach(o=>{o.im.src=o.frames[n].src;o.info.textContent="프레임 "+String(n+1).padStart(2,"0")+" / 12"});window.frameIndex=n+1}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
